[workspace]
resolver = "2"
members = [
    "core/camel-util",
    "core/camel-api",
    "core/camel-support",
    "core/camel-core-processor",
    "core/camel-core-languages",
    "core/camel-base-engine",
    "core/camel-core-model",
    "core/camel-core-reifier",
    "core/camel-core-engine",
    "core/camel-core",
    "components/camel-direct",
    "components/camel-mock",
    "components/camel-log",
    "components/camel-seda",
]

[workspace.package]
version = "4.23.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/apache/camel"
rust-version = "1.80"

[workspace.dependencies]
camel-util = { path = "core/camel-util" }
camel-api = { path = "core/camel-api" }
camel-support = { path = "core/camel-support" }
camel-core-processor = { path = "core/camel-core-processor" }
camel-core-languages = { path = "core/camel-core-languages" }
camel-base-engine = { path = "core/camel-base-engine" }
camel-core-model = { path = "core/camel-core-model" }
camel-core-reifier = { path = "core/camel-core-reifier" }
camel-core-engine = { path = "core/camel-core-engine" }
camel-core = { path = "core/camel-core" }
camel-direct = { path = "components/camel-direct" }
camel-mock = { path = "components/camel-mock" }
camel-log = { path = "components/camel-log" }
camel-seda = { path = "components/camel-seda" }
