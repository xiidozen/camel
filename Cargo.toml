[workspace]
resolver = "2"
members = [
    "core/camel-util",
    "core/camel-api",
    "core/camel-support",
    "core/camel-base",
    "core/camel-core-processor",
    "core/camel-core-languages",
    "core/camel-base-engine",
    "core/camel-core-model",
    "core/camel-core-reifier",
    "core/camel-core-engine",
    "core/camel-core",
    "components/camel-direct",
    "components/camel-mock",
    "components/camel-log",
    "components/camel-seda",
    "components/camel-stub",
    "components/camel-ref",
    "components/camel-browse",
    "components/camel-language",
    "components/camel-scheduler",
    "components/camel-controlbus",
    "components/camel-base64",
    "components/camel-zip-deflater",
    "components/camel-dataformat",
    "components/camel-dataset",
    "components/camel-zipfile",
    "components/camel-csv",
    "components/camel-lzf",
    "components/camel-toon",
    "components/camel-gson",
    "components/camel-jsonb",
    "components/camel-fastjson",
    "components/camel-jsoup",
    "components/camel-tarfile",
    "components/camel-jackson",
    "components/camel-jsonpath",
    "components/camel-bean",
    "components/camel-timer",
    "dsl/camel-yaml-dsl/camel-yaml-dsl",
    "dsl/camel-xml-io-dsl",
    "core/camel-main",
    "components/camel-file",
]

[workspace.package]
version = "4.23.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/apache/camel"
rust-version = "1.80"

[workspace.dependencies]
camel-util = { path = "core/camel-util" }
camel-api = { path = "core/camel-api" }
camel-support = { path = "core/camel-support" }
camel-base = { path = "core/camel-base" }
camel-core-processor = { path = "core/camel-core-processor" }
camel-core-languages = { path = "core/camel-core-languages" }
camel-base-engine = { path = "core/camel-base-engine" }
camel-core-model = { path = "core/camel-core-model" }
camel-core-reifier = { path = "core/camel-core-reifier" }
camel-core-engine = { path = "core/camel-core-engine" }
camel-core = { path = "core/camel-core" }
camel-direct = { path = "components/camel-direct" }
camel-mock = { path = "components/camel-mock" }
camel-log = { path = "components/camel-log" }
camel-seda = { path = "components/camel-seda" }
camel-stub = { path = "components/camel-stub" }
camel-ref = { path = "components/camel-ref" }
camel-browse = { path = "components/camel-browse" }
camel-language = { path = "components/camel-language" }
camel-scheduler = { path = "components/camel-scheduler" }
camel-controlbus = { path = "components/camel-controlbus" }
camel-base64 = { path = "components/camel-base64" }
camel-zip-deflater = { path = "components/camel-zip-deflater" }
camel-dataformat = { path = "components/camel-dataformat" }
camel-dataset = { path = "components/camel-dataset" }
camel-zipfile = { path = "components/camel-zipfile" }
camel-csv = { path = "components/camel-csv" }
camel-lzf = { path = "components/camel-lzf" }
camel-toon = { path = "components/camel-toon" }
camel-gson = { path = "components/camel-gson" }
camel-jsonb = { path = "components/camel-jsonb" }
camel-fastjson = { path = "components/camel-fastjson" }
camel-jsoup = { path = "components/camel-jsoup" }
camel-tarfile = { path = "components/camel-tarfile" }
camel-jackson = { path = "components/camel-jackson" }
camel-jsonpath = { path = "components/camel-jsonpath" }
camel-bean = { path = "components/camel-bean" }
camel-timer = { path = "components/camel-timer" }
camel-yaml-dsl = { path = "dsl/camel-yaml-dsl/camel-yaml-dsl" }
camel-xml-io-dsl = { path = "dsl/camel-xml-io-dsl" }
camel-main = { path = "core/camel-main" }
camel-file = { path = "components/camel-file" }
