[workspace]
resolver = "2"
members = [
    "core/camel-util",
    "core/camel-api",
    "core/camel-support",
    "core/camel-core-processor",
    "core/camel-base-engine",
    "components/camel-direct",
]

[workspace.package]
version = "4.23.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/apache/camel"
rust-version = "1.80"

[workspace.dependencies]
camel-util = { path = "core/camel-util" }
camel-api = { path = "core/camel-api" }
camel-support = { path = "core/camel-support" }
camel-core-processor = { path = "core/camel-core-processor" }
camel-base-engine = { path = "core/camel-base-engine" }
camel-direct = { path = "components/camel-direct" }
