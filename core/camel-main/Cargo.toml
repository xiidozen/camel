[package]
name = "camel-main"
description = "Camel :: Main — bootstrapping a standalone Camel application (port of core/camel-main)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
camel-api = { workspace = true }
camel-util = { workspace = true }
camel-core = { workspace = true }
log = "0.4"
tokio = { version = "1", features = ["rt", "sync", "time", "signal", "macros"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "time", "macros"] }
